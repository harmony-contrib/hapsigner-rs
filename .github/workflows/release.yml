name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release CLI
        run: cargo build --release --locked --package hapsigner --bin hap-sign --features cli --target "$TARGET"
      - name: Package and smoke-test binary
        run: |
          binary=hap-sign
          case "${TARGET}" in *-windows-*) binary=hap-sign.exe ;; esac
          asset="hap-sign-${TARGET}.tar.gz"
          mkdir -p package smoke
          cp "target/${TARGET}/release/${binary}" package/
          cp LICENSE README.md THIRD_PARTY_NOTICES.md package/
          tar -C package -czf "${asset}" "${binary}" LICENSE README.md THIRD_PARTY_NOTICES.md
          tar -xzf "${asset}" -C smoke
          test "$("./smoke/${binary}" --version)" = "hap-sign ${RELEASE_TAG#v}"
          "./smoke/${binary}" --help
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" >"${asset}.sha256"
          else
            shasum -a 256 "${asset}" >"${asset}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hap-sign-${{ matrix.target }}
          path: hap-sign-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: hap-sign-*
          path: artifacts
          merge-multiple: true
      - name: Verify archive checksums
        working-directory: artifacts
        run: sha256sum -c *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.26.2
      - name: Verify installation from published binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall hapsigner --version "=${RELEASE_TAG#v}" --manifest-path Cargo.toml \
            --strategies crate-meta-data --no-confirm \
            --install-path "$RUNNER_TEMP/binstall-smoke"
          test "$("$RUNNER_TEMP/binstall-smoke/hap-sign" --version)" = "hap-sign ${RELEASE_TAG#v}"
